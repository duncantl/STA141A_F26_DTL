# Course Goals

For each of you to

+ Become a proficient R programmer

--

# AI 

+ Many job interviews will not allow you to use AI during the interview.  
  + Want to see what you know
  + Could you solve the problem and write the code yourself.
    + If you can, then sure you can use AI because you have shown you are capable of doing it
      yourself.
  + If you can't do it yourself, why should they employ you.
     + All you are doing is passing the "prompt" to AI and passing on the results.

+ If you can show that you can do it faster with AI but know how to understand, review, verify the results, then  you
  are in better shape.
   + But w/o ability to reason about the problem, you are a not better than AI itself.

---
# Learn to use AI

+ You should learn to use AI 
   + to be productive
   + to learn about things efficiently

+ For programming, learn to use AI after you have learned to program yourself.
   + You can then learn how to use AI to be more efficient.

+ That is a separate class
   + If there isn't one, ask for it.

# Posting on Piazza
### Before Posting

+ Make certain to read all the posts - regularly

  + Part of the course learning.

  + You will learn a lot and find suggestions about how to approach aspects of the assignments.

+ Don’t repeat a question, i.e., that was asked previously.

+ Try to find the answer or some background information
    before simply expecting others to look it up for you.


---
# Posting on Piazza
### Example of Bad Question

+ “I tried to read the data and it didn’t work”
   + What data - a file, a URL? What format? Does the file actually exist?….

+ What’s “it”?

+ In what way didn’t it “work”?


---
# Posting on Piazza
### Good Question

+ Much more likely to get a good answer quickly if you
   pose a question well

+ Focus on what information is necessary for a reader who isn’t sitting in front of your computer

+ Enough to provide all the relevant details

+ Not too much so reader can’t see the relevant element

   + And doesn’t bother to reply.


---
# Posting on Piazza
### Good Question

+ Minimal reproducible example

  + Take the time to create a much simpler version of only
     the part of your code that exhibits the problem.

  + Doing this will often be enough to solve the problem yourself.

    + You will have learned a lot in the process of solving it yourself.

    + This is where you learn for the future.

---
# Posting on Piazza
### Good Question

In the question, state

+ what you expect the code to do and what results you expect it to produce

+ what it actually produces

+ In what ways these are different.

+ Include any error or warning message

+ And the output from sessionInfo()
